<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily-Forge</title>
    <link href="./style.css" rel="stylesheet" />
    <script src="https://kit.fontawesome.com/8a35c13b0b.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <nav>
        <div class="header">
            <img src="./images/logo-clean.png" alt="" />
            <div class="header-feature">
                <h3><a href="#">Task</a></h3>
                <h3><a href="./notes.html">Notes</a></h3>
            </div>
            <div class="header-mode" id="theme-toggle">
                <i class="fa-solid fa-moon "></i>
                <i class="fa-solid fa-sun "></i>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="graph-container">
            <h2>Daily Streak: <span id="streak-count">0</span></h2>
            <canvas id="streakChart"></canvas>
        </div>

        <div id="task-container" class="task-container">
            <div class="sec-1">
                <input id="taskInput" class="task-container-input" maxlength="30" type="text" placeholder="enter your task">
                <button id="add-task-btn" class="add-task-btn">+</button>
            </div>
        </div>
    </div>

    <div id="popup-menu" class="popup-menu hidden">
        <!-- <button id="edit-task-btn" class="popup-btn"><i class="fa-solid fa-pen"></i></button> -->
        <button id="delete-task-btn" class="popup-btn"><i class="fa-solid fa-trash"></i></button>
    </div>

    <script src="./common.js"></script>
    <script src="./tasks.js"></script>
</body>

</html>
